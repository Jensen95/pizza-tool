<!doctype html>
<html lang="da">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#d32f2f" />
		<meta name="description" content="Pizza dej opskrifter og beregner" />
		<link rel="manifest" href="/manifest.json" />
		<link rel="apple-touch-icon" href="/icons/icon-192.png" />
		<script>
			// Apply a chosen theme before the first paint. The app renders on the
			// client only, so without this a dark choice would flash light first.
			try {
				var prefs = JSON.parse(localStorage.getItem('pizza-tool-preferences') || '{}');
				if (prefs.colorTheme === 'light' || prefs.colorTheme === 'dark') {
					document.documentElement.dataset.theme = prefs.colorTheme;
				}
			} catch (error) {
				// Storage unavailable or unreadable: follow the device
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<script>
			if ('serviceWorker' in navigator) {
				const assetBase = '%sveltekit.assets%'.replace(/\/$/, '');
				const serviceWorkerPath = `${assetBase || ''}/service-worker.js`;
				const serviceWorkerScope = assetBase || '/';

				window.addEventListener('load', () => {
					navigator.serviceWorker
						.register(serviceWorkerPath, { scope: serviceWorkerScope })
						.catch((error) => console.error('Service worker registration failed', error));
				});
			}
		</script>
	</body>
</html>
