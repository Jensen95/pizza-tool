<!doctype html>
<html lang="da">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#2e7d32" />
		<meta name="description" content="Pizza dej opskrifter og beregner" />
		<link rel="manifest" href="/manifest.json" />
		<link rel="apple-touch-icon" href="/icons/icon-192.png" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<script>
			if ('serviceWorker' in navigator) {
				const assetBase = '%sveltekit.assets%'.replace(/\/$/, '');
				const serviceWorkerPath = `${assetBase || ''}/service-worker.js`;
				const serviceWorkerScope = assetBase || '/';

				window.addEventListener('load', () => {
					navigator.serviceWorker
						.register(serviceWorkerPath, { scope: serviceWorkerScope })
						.catch((error) => console.error('Service worker registration failed', error));
				});
			}
		</script>
	</body>
</html>
