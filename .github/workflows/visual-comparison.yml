name: Visual Comparison

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ['main', 'master']

permissions:
  contents: read
  pull-requests: write

jobs:
  visual-comparison:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build PR version
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Take screenshots of PR version
        run: |
          mkdir -p screenshots/pr
          npx playwright test --grep "@screenshot" --project=chromium || true
          # Copy screenshots to dedicated directory
          find test-results -name "*.png" -exec cp {} screenshots/pr/ \; 2>/dev/null || true
        continue-on-error: true

      - name: Checkout base branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.base_ref }}
          clean: false

      - name: Install dependencies (base)
        run: npm ci

      - name: Build base version
        run: npm run build

      - name: Take screenshots of base version
        run: |
          mkdir -p screenshots/base
          rm -rf test-results
          npx playwright test --grep "@screenshot" --project=chromium || true
          # Copy screenshots to dedicated directory
          find test-results -name "*.png" -exec cp {} screenshots/base/ \; 2>/dev/null || true
        continue-on-error: true

      - name: Upload screenshots and create comment
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const https = require('https');

            // Function to upload image to GitHub's CDN
            async function uploadImageToGitHub(imagePath, filename) {
              try {
                const imageBuffer = fs.readFileSync(imagePath);
                
                // Step 1: Get upload policy from GitHub
                // This is the same endpoint the UI uses when you drag/drop images
                const policyResponse = await fetch('https://github.com/upload/policies/assets', {
                  method: 'POST',
                  headers: {
                    'Accept': 'application/json',
                    'Authorization': `token ${process.env.GITHUB_TOKEN}`,
                    'Content-Type': 'application/json',
                  },
                  body: JSON.stringify({
                    name: filename,
                    size: imageBuffer.length,
                    content_type: 'image/png',
                    repository_id: context.payload.repository.id,
                  })
                });

                if (!policyResponse.ok) {
                  const errorText = await policyResponse.text();
                  console.error(`Failed to get upload policy for ${filename}: ${policyResponse.status} - ${errorText}`);
                  return null;
                }

                const policy = await policyResponse.json();
                
                // Step 2: Upload image to the provided URL
                const uploadResponse = await fetch(policy.upload_url, {
                  method: 'PUT',
                  headers: {
                    'Content-Type': 'image/png',
                    'Content-Length': imageBuffer.length.toString(),
                    ...policy.headers,
                  },
                  body: imageBuffer,
                });

                if (!uploadResponse.ok) {
                  console.error(`Failed to upload ${filename}: ${uploadResponse.status}`);
                  return null;
                }

                // Step 3: Return the asset URL
                return policy.asset_url || policy.url;
              } catch (error) {
                console.error(`Error uploading ${imagePath}:`, error);
                return null;
              }
            }

            // Collect screenshots
            const prScreenshotsDir = 'screenshots/pr';
            const baseScreenshotsDir = 'screenshots/base';

            let prScreenshots = [];
            let baseScreenshots = [];

            try {
              if (fs.existsSync(prScreenshotsDir)) {
                prScreenshots = fs.readdirSync(prScreenshotsDir)
                  .filter(f => f.endsWith('.png'))
                  .sort();
              }
            } catch (e) {
              console.log('No PR screenshots found');
            }

            try {
              if (fs.existsSync(baseScreenshotsDir)) {
                baseScreenshots = fs.readdirSync(baseScreenshotsDir)
                  .filter(f => f.endsWith('.png'))
                  .sort();
              }
            } catch (e) {
              console.log('No base screenshots found');
            }

            // Build comment with uploaded images in collapsible details
            let commentBody = '## 📸 Visual Comparison\n\n';

            if (prScreenshots.length === 0 && baseScreenshots.length === 0) {
              commentBody += '> ⚠️ No screenshots were captured. Make sure tests are tagged with `@screenshot`.\n';
            } else {
              commentBody += `**Screenshots captured**: ${prScreenshots.length} PR screenshot(s), ${baseScreenshots.length} base screenshot(s)\n\n`;

              // Get unique screenshot names
              const allScreenshots = new Set([...prScreenshots, ...baseScreenshots]);

              for (const filename of Array.from(allScreenshots).sort()) {
                const basePath = path.join(baseScreenshotsDir, filename);
                const prPath = path.join(prScreenshotsDir, filename);

                const baseExists = fs.existsSync(basePath);
                const prExists = fs.existsSync(prPath);

                // Use collapsible details block for each screenshot
                commentBody += `<details>\n<summary><b>${filename}</b></summary>\n\n`;
                commentBody += '<table><tr><th>Base (main)</th><th>PR Changes</th></tr><tr>';

                // Base screenshot - upload to GitHub CDN
                if (baseExists) {
                  console.log(`Uploading base screenshot: ${filename}`);
                  const baseUrl = await uploadImageToGitHub(basePath, `base-${filename}`);
                  if (baseUrl) {
                    commentBody += `<td><img src="${baseUrl}" width="400" /></td>`;
                  } else {
                    commentBody += '<td>❌ Upload failed</td>';
                  }
                } else {
                  commentBody += '<td>❌ Not found</td>';
                }

                // PR screenshot - upload to GitHub CDN
                if (prExists) {
                  console.log(`Uploading PR screenshot: ${filename}`);
                  const prUrl = await uploadImageToGitHub(prPath, `pr-${filename}`);
                  if (prUrl) {
                    commentBody += `<td><img src="${prUrl}" width="400" /></td>`;
                  } else {
                    commentBody += '<td>❌ Upload failed</td>';
                  }
                } else {
                  commentBody += '<td>❌ Not found</td>';
                }

                commentBody += '</tr></table>\n\n';
                commentBody += '</details>\n\n';
              }

              commentBody += '\n> 💡 **Note**: Screenshots uploaded to GitHub CDN (user-attachments). Click to expand each comparison.\n';
            }

            commentBody += '\n---\n';
            commentBody += `*Workflow run: [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})*\n`;

            // Post comment
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: commentBody
            });
