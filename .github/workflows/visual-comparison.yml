name: Visual Comparison

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ['main', 'master']

permissions:
  contents: read
  pull-requests: write

jobs:
  visual-comparison:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build PR version
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Take screenshots of PR version
        run: |
          mkdir -p screenshots/pr
          npx playwright test --grep "@screenshot" --project=chromium || true
          # Copy screenshots to dedicated directory
          find test-results -name "*.png" -exec cp {} screenshots/pr/ \; 2>/dev/null || true
        continue-on-error: true

      - name: Checkout base branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.base_ref }}
          clean: false

      - name: Install dependencies (base)
        run: npm ci

      - name: Build base version
        run: npm run build

      - name: Take screenshots of base version
        run: |
          mkdir -p screenshots/base
          rm -rf test-results
          npx playwright test --grep "@screenshot" --project=chromium || true
          # Copy screenshots to dedicated directory
          find test-results -name "*.png" -exec cp {} screenshots/base/ \; 2>/dev/null || true
        continue-on-error: true
