name: Visual Comparison

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ['main', 'master']

permissions:
  contents: read
  pull-requests: write

jobs:
  visual-comparison:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build PR version
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Capture PR screenshots
        env:
          SCREENSHOT_DIR: screenshots/pr
        run: |
          echo "Capturing PR screenshots..."
          npm run test:screenshots -- --project=chromium
          echo "PR screenshots captured:"
          ls -lh screenshots/pr/ || echo "No screenshots found"

      - name: Checkout base branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.base_ref }}
          clean: false

      - name: Install dependencies (base)
        run: npm ci --legacy-peer-deps

      - name: Build base version
        run: npm run build

      - name: Capture base screenshots
        env:
          SCREENSHOT_DIR: screenshots/base
        run: |
          echo "Capturing base screenshots..."
          npm run test:screenshots -- --project=chromium || echo "Base screenshots may not exist yet (first PR)"
          echo "Base screenshots captured:"
          ls -lh screenshots/base/ || echo "No base screenshots"

      - name: Upload to ImgBB and create comment
        uses: actions/github-script@v8
        if: always()
        env:
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            console.log('Starting visual comparison workflow...');

            // Function to upload image to ImgBB
            async function uploadToImgBB(imagePath, filename) {
              try {
                console.log(`Uploading ${filename} to ImgBB...`);
                const imageBuffer = fs.readFileSync(imagePath);
                const base64Image = imageBuffer.toString('base64');
                
                const formData = new URLSearchParams();
                formData.append('image', base64Image);
                formData.append('name', filename);
                
                const response = await fetch(`https://api.imgbb.com/1/upload?key=${process.env.IMGBB_API_KEY}`, {
                  method: 'POST',
                  body: formData,
                  headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                  },
                });

                if (!response.ok) {
                  const errorText = await response.text();
                  console.error(`ImgBB upload failed for ${filename}: ${response.status} - ${errorText}`);
                  return null;
                }

                const result = await response.json();
                if (result.success && result.data && result.data.url) {
                  console.log(`✓ Uploaded ${filename} to ImgBB: ${result.data.url}`);
                  return result.data.url;
                }
                
                console.error(`ImgBB upload failed for ${filename}: No URL in response`);
                return null;
              } catch (error) {
                console.error(`Error uploading ${filename} to ImgBB:`, error);
                return null;
              }
            }

            // Collect screenshot files
            const prScreenshotsDir = 'screenshots/pr';
            const baseScreenshotsDir = 'screenshots/base';

            let prScreenshots = [];
            let baseScreenshots = [];

            // Check for PR screenshots
            if (fs.existsSync(prScreenshotsDir)) {
              prScreenshots = fs.readdirSync(prScreenshotsDir)
                .filter(f => f.endsWith('.png'))
                .sort();
              console.log(`Found ${prScreenshots.length} PR screenshots:`, prScreenshots);
            } else {
              console.log('PR screenshots directory not found');
            }

            // Check for base screenshots
            if (fs.existsSync(baseScreenshotsDir)) {
              baseScreenshots = fs.readdirSync(baseScreenshotsDir)
                .filter(f => f.endsWith('.png'))
                .sort();
              console.log(`Found ${baseScreenshots.length} base screenshots:`, baseScreenshots);
            } else {
              console.log('Base screenshots directory not found');
            }

            // Build comment
            let commentBody = '## 📸 Visual Comparison\n\n';

            if (prScreenshots.length === 0 && baseScreenshots.length === 0) {
              commentBody += '> ⚠️ No screenshots captured\n';
              console.log('No screenshots found, posting warning comment');
            } else {
              console.log('Building comparison comment...');
              
              // Get unique screenshot names
              const allScreenshots = new Set([...prScreenshots, ...baseScreenshots]);
              console.log(`Processing ${allScreenshots.size} unique screenshots`);

              for (const filename of Array.from(allScreenshots).sort()) {
                console.log(`Processing screenshot: ${filename}`);
                const basePath = path.join(baseScreenshotsDir, filename);
                const prPath = path.join(prScreenshotsDir, filename);

                const baseExists = fs.existsSync(basePath);
                const prExists = fs.existsSync(prPath);

                console.log(`  Base exists: ${baseExists}, PR exists: ${prExists}`);

                // Use collapsible details block
                commentBody += `<details>\n<summary><b>${filename}</b></summary>\n\n`;
                commentBody += '<table><tr><th>Base (main)</th><th>PR Changes</th></tr><tr>';

                // Base screenshot - upload to ImgBB
                if (baseExists) {
                  const baseUrl = await uploadToImgBB(basePath, `base-${filename}`);
                  if (baseUrl) {
                    commentBody += `<td><img src="${baseUrl}" width="400" /></td>`;
                  } else {
                    commentBody += '<td>Upload failed</td>';
                  }
                } else {
                  commentBody += '<td>-</td>';
                }

                // PR screenshot - upload to ImgBB
                if (prExists) {
                  const prUrl = await uploadToImgBB(prPath, `pr-${filename}`);
                  if (prUrl) {
                    commentBody += `<td><img src="${prUrl}" width="400" /></td>`;
                  } else {
                    commentBody += '<td>Upload failed</td>';
                  }
                } else {
                  commentBody += '<td>-</td>';
                }

                commentBody += '</tr></table>\n\n';
                commentBody += '</details>\n\n';
              }
            }

            // Post comment
            console.log('Posting comment to PR...');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: commentBody
            });
            console.log('Comment posted successfully!');
