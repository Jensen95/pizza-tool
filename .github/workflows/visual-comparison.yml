name: Visual Comparison

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ['main', 'master']

permissions:
  contents: read
  pull-requests: write

jobs:
  visual-comparison:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build PR version
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Take screenshots of PR version
        run: |
          mkdir -p screenshots/pr
          npx playwright test --grep "@screenshot" --project=chromium || true
          # Copy screenshots to dedicated directory
          find test-results -name "*.png" -exec cp {} screenshots/pr/ \; 2>/dev/null || true
        continue-on-error: true

      - name: Upload PR screenshots as artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-screenshots
          path: screenshots/pr/
          retention-days: 7

      - name: Checkout base branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.base_ref }}
          clean: false

      - name: Install dependencies (base)
        run: npm ci

      - name: Build base version
        run: npm run build

      - name: Take screenshots of base version
        run: |
          mkdir -p screenshots/base
          rm -rf test-results
          npx playwright test --grep "@screenshot" --project=chromium || true
          # Copy screenshots to dedicated directory
          find test-results -name "*.png" -exec cp {} screenshots/base/ \; 2>/dev/null || true
        continue-on-error: true

      - name: Upload base screenshots as artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: base-screenshots
          path: screenshots/base/
          retention-days: 7

      - name: Upload screenshots and create comment
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Collect screenshots
            const prScreenshotsDir = 'screenshots/pr';
            const baseScreenshotsDir = 'screenshots/base';

            let prScreenshots = [];
            let baseScreenshots = [];

            try {
              if (fs.existsSync(prScreenshotsDir)) {
                prScreenshots = fs.readdirSync(prScreenshotsDir)
                  .filter(f => f.endsWith('.png'))
                  .sort();
              }
            } catch (e) {
              console.log('No PR screenshots found');
            }

            try {
              if (fs.existsSync(baseScreenshotsDir)) {
                baseScreenshots = fs.readdirSync(baseScreenshotsDir)
                  .filter(f => f.endsWith('.png'))
                  .sort();
              }
            } catch (e) {
              console.log('No base screenshots found');
            }

            // Build comment with embedded images
            let commentBody = '## 📸 Visual Comparison\n\n';

            if (prScreenshots.length === 0 && baseScreenshots.length === 0) {
              commentBody += '> ⚠️ No screenshots were captured. Make sure tests are tagged with `@screenshot`.\n';
            } else {
              commentBody += `**Screenshots captured**: ${prScreenshots.length} PR screenshot(s), ${baseScreenshots.length} base screenshot(s)\n\n`;

              // Get unique screenshot names
              const allScreenshots = new Set([...prScreenshots, ...baseScreenshots]);

              commentBody += '### Screenshot Comparison\n\n';
              commentBody += '| Screenshot | Status |\n';
              commentBody += '|------------|--------|\n';

              for (const filename of Array.from(allScreenshots).sort()) {
                const basePath = path.join(baseScreenshotsDir, filename);
                const prPath = path.join(prScreenshotsDir, filename);

                const baseExists = fs.existsSync(basePath);
                const prExists = fs.existsSync(prPath);

                let status = '';
                if (baseExists && prExists) {
                  status = '✅ Captured in both versions';
                } else if (prExists) {
                  status = '🆕 New in PR';
                } else if (baseExists) {
                  status = '❌ Missing in PR';
                }

                commentBody += `| ${filename} | ${status} |\n`;
              }

              commentBody += '\n> 💡 **Note**: Screenshots were captured successfully. Due to GitHub comment size limits, images are not embedded directly.\n';
              commentBody += '> Screenshots are available as artifacts in the workflow run - download `pr-screenshots` and `base-screenshots` to compare.\n';
            }

            commentBody += '\n---\n';
            commentBody += `*Workflow run: [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})*\n`;

            // Post comment
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: commentBody
            });
