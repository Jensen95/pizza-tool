name: Visual Comparison

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ['main', 'master']

permissions:
  contents: read
  pull-requests: write

jobs:
  visual-comparison:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build PR version
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Take screenshots of PR version
        run: |
          mkdir -p screenshots/pr
          npx playwright test --grep "@screenshot" --project=chromium || true
          # Copy screenshots to dedicated directory
          find test-results -name "*.png" -exec cp {} screenshots/pr/ \; 2>/dev/null || true
        continue-on-error: true

      - name: Checkout base branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.base_ref }}
          clean: false

      - name: Install dependencies (base)
        run: npm ci

      - name: Build base version
        run: npm run build

      - name: Take screenshots of base version
        run: |
          mkdir -p screenshots/base
          rm -rf test-results
          npx playwright test --grep "@screenshot" --project=chromium || true
          # Copy screenshots to dedicated directory
          find test-results -name "*.png" -exec cp {} screenshots/base/ \; 2>/dev/null || true
        continue-on-error: true

      - name: Create comment body with screenshots
        id: build-comment
        run: |
          # Create comment body file
          cat > comment-body.md << 'COMMENT_EOF'
          ## 📸 Visual Comparison

          Screenshots captured for visual regression testing.

          COMMENT_EOF

          # Add screenshots if they exist
          if [ -d "screenshots/pr" ] && [ "$(ls -A screenshots/pr/*.png 2>/dev/null)" ]; then
            echo "" >> comment-body.md
            echo "### PR Screenshots" >> comment-body.md
            echo "" >> comment-body.md
            
            for img in screenshots/pr/*.png; do
              if [ -f "$img" ]; then
                filename=$(basename "$img")
                echo "#### $filename" >> comment-body.md
                echo "" >> comment-body.md
                # The image will be uploaded by gh CLI automatically
                echo "![PR: $filename]($img)" >> comment-body.md
                echo "" >> comment-body.md
              fi
            done
          fi

          if [ -d "screenshots/base" ] && [ "$(ls -A screenshots/base/*.png 2>/dev/null)" ]; then
            echo "" >> comment-body.md
            echo "### Base Screenshots" >> comment-body.md
            echo "" >> comment-body.md
            
            for img in screenshots/base/*.png; do
              if [ -f "$img" ]; then
                filename=$(basename "$img")
                echo "#### $filename" >> comment-body.md
                echo "" >> comment-body.md
                echo "![Base: $filename]($img)" >> comment-body.md
                echo "" >> comment-body.md
              fi
            done
          fi

          echo "" >> comment-body.md
          echo "---" >> comment-body.md
          echo "*Images are automatically uploaded to GitHub's hosting (user-attachments) by gh CLI*" >> comment-body.md

      - name: Post comment with images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Use gh CLI to post comment - it will automatically upload images
          gh pr comment ${{ github.event.pull_request.number }} --body-file comment-body.md
