name: Visual Comparison

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ['main', 'master']

permissions:
  contents: read
  pull-requests: write

jobs:
  visual-comparison:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build PR version
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Take screenshots of PR version
        run: |
          npx playwright test --grep "@screenshot" --project=chromium || true
        continue-on-error: true

      - name: Upload PR screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-screenshots
          path: test-results/
          retention-days: 7

      - name: Checkout base branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.base_ref }}

      - name: Install dependencies (base)
        run: npm ci

      - name: Build base version
        run: npm run build

      - name: Take screenshots of base version
        run: |
          npx playwright test --grep "@screenshot" --project=chromium || true
        continue-on-error: true

      - name: Upload base screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: base-screenshots
          path: test-results/
          retention-days: 7

      - name: Comment on PR
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const message = `## 📸 Visual Comparison

            Screenshots have been captured for this PR. You can download and compare them from the workflow artifacts:

            - **PR Version**: Available in \`pr-screenshots\` artifact
            - **Base Version**: Available in \`base-screenshots\` artifact

            To view the artifacts, click on "Details" next to this check, then scroll to the "Artifacts" section at the bottom of the workflow run page.

            > **Note**: Visual comparison screenshots are only generated when tests are tagged with \`@screenshot\`.`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });
