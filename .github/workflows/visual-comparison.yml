name: Visual Comparison

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ['main', 'master']

permissions:
  contents: read
  pull-requests: write

jobs:
  visual-comparison:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build PR version
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Take screenshots of PR version
        run: |
          mkdir -p screenshots/pr
          npx playwright test --grep "@screenshot" --project=chromium || true
          # Copy screenshots to dedicated directory
          find test-results -name "*.png" -exec cp {} screenshots/pr/ \; 2>/dev/null || true
        continue-on-error: true

      - name: Checkout base branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.base_ref }}
          clean: false

      - name: Install dependencies (base)
        run: npm ci

      - name: Build base version
        run: npm run build

      - name: Take screenshots of base version
        run: |
          mkdir -p screenshots/base
          rm -rf test-results
          npx playwright test --grep "@screenshot" --project=chromium || true
          # Copy screenshots to dedicated directory
          find test-results -name "*.png" -exec cp {} screenshots/base/ \; 2>/dev/null || true
        continue-on-error: true

      - name: Install sharp for image processing
        run: npm install sharp

      - name: Upload screenshots and create comment
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const sharp = require('sharp');

            // Collect screenshots
            const prScreenshotsDir = 'screenshots/pr';
            const baseScreenshotsDir = 'screenshots/base';

            let prScreenshots = [];
            let baseScreenshots = [];

            try {
              if (fs.existsSync(prScreenshotsDir)) {
                prScreenshots = fs.readdirSync(prScreenshotsDir)
                  .filter(f => f.endsWith('.png'))
                  .sort();
              }
            } catch (e) {
              console.log('No PR screenshots found');
            }

            try {
              if (fs.existsSync(baseScreenshotsDir)) {
                baseScreenshots = fs.readdirSync(baseScreenshotsDir)
                  .filter(f => f.endsWith('.png'))
                  .sort();
              }
            } catch (e) {
              console.log('No base screenshots found');
            }

            // Helper function to compress and convert image to base64
            async function compressImageToBase64(imagePath) {
              try {
                // Resize to max width 600px and compress to JPEG with quality 70
                const buffer = await sharp(imagePath)
                  .resize(600, null, { fit: 'inside', withoutEnlargement: true })
                  .jpeg({ quality: 70 })
                  .toBuffer();
                
                return `data:image/jpeg;base64,${buffer.toString('base64')}`;
              } catch (error) {
                console.error(`Error compressing ${imagePath}:`, error);
                return null;
              }
            }

            // Build comment with embedded images
            let commentBody = '## 📸 Visual Comparison\n\n';

            if (prScreenshots.length === 0 && baseScreenshots.length === 0) {
              commentBody += '> ⚠️ No screenshots were captured. Make sure tests are tagged with `@screenshot`.\n';
            } else {
              commentBody += `**Screenshots captured**: ${prScreenshots.length} PR screenshot(s), ${baseScreenshots.length} base screenshot(s)\n\n`;

              // Get unique screenshot names
              const allScreenshots = new Set([...prScreenshots, ...baseScreenshots]);

              for (const filename of Array.from(allScreenshots).sort()) {
                const basePath = path.join(baseScreenshotsDir, filename);
                const prPath = path.join(prScreenshotsDir, filename);

                const baseExists = fs.existsSync(basePath);
                const prExists = fs.existsSync(prPath);

                commentBody += `### ${filename}\n\n`;
                commentBody += '<table><tr><th>Base (main)</th><th>PR Changes</th></tr><tr>';

                // Base screenshot
                if (baseExists) {
                  const baseUrl = await compressImageToBase64(basePath);
                  if (baseUrl) {
                    commentBody += `<td><img src="${baseUrl}" width="400" /></td>`;
                  } else {
                    commentBody += '<td>❌ Error processing image</td>';
                  }
                } else {
                  commentBody += '<td>❌ Not found</td>';
                }

                // PR screenshot
                if (prExists) {
                  const prUrl = await compressImageToBase64(prPath);
                  if (prUrl) {
                    commentBody += `<td><img src="${prUrl}" width="400" /></td>`;
                  } else {
                    commentBody += '<td>❌ Error processing image</td>';
                  }
                } else {
                  commentBody += '<td>❌ Not found</td>';
                }

                commentBody += '</tr></table>\n\n';
              }

              commentBody += '\n> 💡 **Note**: Screenshots are compressed (600px width, JPEG quality 70) to fit within comment size limits.\n';
            }

            commentBody += '\n---\n';
            commentBody += `*Workflow run: [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})*\n`;

            // Post comment
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: commentBody
            });
