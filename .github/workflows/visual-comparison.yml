name: Visual Comparison

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ['main', 'master']

permissions:
  contents: read
  pull-requests: write

jobs:
  visual-comparison:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build PR version
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Take screenshots of PR version
        run: |
          mkdir -p screenshots/pr
          npx playwright test --grep "@screenshot" --project=chromium || true
          # Copy screenshots to dedicated directory
          find test-results -name "*.png" -exec cp {} screenshots/pr/ \; 2>/dev/null || true
        continue-on-error: true

      - name: Checkout base branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.base_ref }}
          clean: false

      - name: Install dependencies (base)
        run: npm ci

      - name: Build base version
        run: npm run build

      - name: Take screenshots of base version
        run: |
          mkdir -p screenshots/base
          rm -rf test-results
          npx playwright test --grep "@screenshot" --project=chromium || true
          # Copy screenshots to dedicated directory
          find test-results -name "*.png" -exec cp {} screenshots/base/ \; 2>/dev/null || true
        continue-on-error: true

      - name: Install sharp for image compression
        run: npm install sharp

      - name: Create comment with embedded images
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const sharp = require('sharp');

            // Function to compress and encode image as base64
            async function compressAndEncode(imagePath) {
              try {
                const compressed = await sharp(imagePath)
                  .resize(800, null, { withoutEnlargement: true })
                  .jpeg({ quality: 75 })
                  .toBuffer();
                return `data:image/jpeg;base64,${compressed.toString('base64')}`;
              } catch (error) {
                console.error(`Error compressing ${imagePath}:`, error);
                return null;
              }
            }

            // Collect screenshot files
            const prScreenshotsDir = 'screenshots/pr';
            const baseScreenshotsDir = 'screenshots/base';

            let prScreenshots = [];
            let baseScreenshots = [];

            try {
              if (fs.existsSync(prScreenshotsDir)) {
                prScreenshots = fs.readdirSync(prScreenshotsDir)
                  .filter(f => f.endsWith('.png'))
                  .sort();
              }
            } catch (e) {
              console.log('No PR screenshots found');
            }

            try {
              if (fs.existsSync(baseScreenshotsDir)) {
                baseScreenshots = fs.readdirSync(baseScreenshotsDir)
                  .filter(f => f.endsWith('.png'))
                  .sort();
              }
            } catch (e) {
              console.log('No base screenshots found');
            }

            // Build comment
            let commentBody = '## 📸 Visual Comparison\n\n';

            if (prScreenshots.length === 0 && baseScreenshots.length === 0) {
              commentBody += '> ⚠️ No screenshots captured\n';
            } else {
              // Get unique screenshot names
              const allScreenshots = new Set([...prScreenshots, ...baseScreenshots]);

              for (const filename of Array.from(allScreenshots).sort()) {
                const basePath = path.join(baseScreenshotsDir, filename);
                const prPath = path.join(prScreenshotsDir, filename);

                const baseExists = fs.existsSync(basePath);
                const prExists = fs.existsSync(prPath);

                // Use collapsible details block
                commentBody += `<details>\n<summary><b>${filename}</b></summary>\n\n`;
                commentBody += '<table><tr><th>Base (main)</th><th>PR Changes</th></tr><tr>';

                // Base screenshot
                if (baseExists) {
                  const baseData = await compressAndEncode(basePath);
                  if (baseData) {
                    commentBody += `<td><img src="${baseData}" width="400" /></td>`;
                  } else {
                    commentBody += '<td>Error loading</td>';
                  }
                } else {
                  commentBody += '<td>-</td>';
                }

                // PR screenshot
                if (prExists) {
                  const prData = await compressAndEncode(prPath);
                  if (prData) {
                    commentBody += `<td><img src="${prData}" width="400" /></td>`;
                  } else {
                    commentBody += '<td>Error loading</td>';
                  }
                } else {
                  commentBody += '<td>-</td>';
                }

                commentBody += '</tr></table>\n\n';
                commentBody += '</details>\n\n';
              }
            }

            // Post comment
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: commentBody
            });

      - name: Upload base screenshots as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: base-screenshots
          path: screenshots/base/
          retention-days: 30

      - name: Upload PR screenshots as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-screenshots
          path: screenshots/pr/
          retention-days: 30
