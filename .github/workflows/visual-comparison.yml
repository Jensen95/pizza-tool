name: Visual Comparison

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ['main', 'master']

permissions:
  contents: read
  pull-requests: write

# A newer push supersedes the comparison of the older one
concurrency:
  group: visual-comparison-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # The job name is a required status check on main; don't rename it
  visual-comparison:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          path: pr
          persist-credentials: false

      # The PR side is GitHub's test merge of the PR into its base. That merge's first parent is
      # exactly the base it was made from, so the two sides can't drift apart if main moves.
      - name: Checkout base branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          path: base
          persist-credentials: false

      - name: Switch to the merge's base parent
        working-directory: base
        run: |
          git checkout --quiet --detach HEAD^1
          git log --oneline -1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: |
            pr/package-lock.json
            base/package-lock.json

      - name: Build PR version
        working-directory: pr
        run: |
          npm ci
          npm run build

      # If the base no longer builds, every PR screenshot is reported as added
      - name: Build base version
        id: base-build
        working-directory: base
        continue-on-error: true
        run: |
          npm ci
          npm run build

      - name: Install Playwright browsers
        working-directory: pr
        run: npx playwright install --with-deps chromium

      - name: Capture PR screenshots
        working-directory: pr
        env:
          SCREENSHOT_DIR: ${{ github.workspace }}/screenshots/pr
        run: npm run test:screenshots -- --project=chromium

      # The PR's specs also capture the base build, so changes to the harness (clock, viewport,
      # new screenshots) apply to both sides and only app changes show up as diffs
      - name: Capture base screenshots
        id: base-capture
        working-directory: pr
        continue-on-error: true
        env:
          SCREENSHOT_DIR: ${{ github.workspace }}/screenshots/base
          SCREENSHOT_APP_DIR: ${{ github.workspace }}/base
        run: npm run test:screenshots -- --project=chromium

      - name: Diff screenshots
        working-directory: pr
        env:
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          BASE_REF: ${{ github.base_ref }}
          BASE_CAPTURED: ${{ steps.base-build.outcome == 'success' && steps.base-capture.outcome == 'success' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node scripts/visual-diff.mjs ../screenshots/base ../screenshots/pr ../screenshots
          cat ../screenshots/comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload screenshots and diffs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-comparison
          path: screenshots/
          if-no-files-found: ignore

      # One comment per PR, updated on every push. A PR without visual changes gets no comment
      # unless an earlier push had some, so the old one doesn't go stale.
      - name: Post or update PR comment
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- visual-comparison -->';
            const body = fs.readFileSync('screenshots/comment.md', 'utf8');
            const report = JSON.parse(fs.readFileSync('screenshots/report.json', 'utf8'));
            const hasChanges = report.some((result) => result.status !== 'unchanged');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            try {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number,
                per_page: 100
              });
              const existing = comments.find(
                (comment) => comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker)
              );
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
                core.info(`Updated ${existing.html_url}`);
              } else if (hasChanges) {
                const { data } = await github.rest.issues.createComment({ owner, repo, issue_number, body });
                core.info(`Commented ${data.html_url}`);
              } else {
                core.info('No visual changes; not commenting.');
              }
            } catch (error) {
              // Dependabot and fork PRs get a read-only token; the job summary still has the result
              core.warning(`Could not comment on the PR: ${error.message}`);
            }
