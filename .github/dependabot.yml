# Dependabot configuration for pizza-tool
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # NPM package dependencies
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '03:00'
      timezone: 'UTC'
    open-pull-requests-limit: 10
    groups:
      # TypeScript - standalone, not bundled with anything
      typescript:
        patterns:
          - 'typescript'
        update-types:
          - 'minor'
          - 'patch'
      # Svelte framework and ecosystem
      svelte-ecosystem:
        patterns:
          - 'svelte'
          - 'svelte-check'
          - '@sveltejs/*'
        update-types:
          - 'minor'
          - 'patch'
      # Vite build tooling
      vite-build:
        patterns:
          - 'vite'
          - '@sveltejs/vite-plugin-svelte'
        update-types:
          - 'minor'
          - 'patch'
      # Unit testing framework
      testing-framework:
        patterns:
          - 'vitest'
          - '@vitest/*'
          - 'happy-dom'
          - 'jsdom'
        update-types:
          - 'minor'
          - 'patch'
      # End-to-end testing
      e2e-testing:
        patterns:
          - '@playwright/*'
          - '@testing-library/*'
        update-types:
          - 'minor'
          - 'patch'
      # Linting tools
      linting:
        patterns:
          - 'eslint'
          - '@eslint/*'
          - 'eslint-*'
          - '@typescript-eslint/*'
          - 'globals'
        update-types:
          - 'minor'
          - 'patch'
      # Code formatting
      formatting:
        patterns:
          - 'prettier'
          - 'prettier-*'
        update-types:
          - 'minor'
          - 'patch'
      # Utility libraries
      utilities:
        patterns:
          - 'sharp'
        update-types:
          - 'minor'
          - 'patch'
      # Production dependencies
      production-dependencies:
        patterns:
          - 'workbox-*'
        update-types:
          - 'minor'
          - 'patch'
    labels:
      - 'dependencies'
      - 'npm'
    commit-message:
      prefix: 'chore(deps)'
      include: 'scope'

  # GitHub Actions dependencies
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '03:00'
      timezone: 'UTC'
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
    labels:
      - 'dependencies'
      - 'github-actions'
    commit-message:
      prefix: 'chore(deps)'
      include: 'scope'
